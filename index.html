<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEVNEX — Everything You Need. One Workspace.</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#eef0f4; --text:#15171c; --muted:#6b7280;
  --accent:#6d5efc; --accent2:#00c9a7; --border:#e3e5ea; --danger:#e5484d;
  --glass-bg:rgba(255,255,255,0.55); --glass-bg2:rgba(255,255,255,0.4); --glass-border:rgba(255,255,255,0.6);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b22; --surface2:#1f232c; --text:#eef0f4; --muted:#9298a6;
    --accent:#8b7bff; --accent2:#2de3bd; --border:#2a2e38; --danger:#ff6b6f;
    --glass-bg:rgba(30,33,42,0.5); --glass-bg2:rgba(30,33,42,0.35); --glass-border:rgba(255,255,255,0.09);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b22; --surface2:#1f232c; --text:#eef0f4; --muted:#9298a6;
  --accent:#8b7bff; --accent2:#2de3bd; --border:#2a2e38; --danger:#ff6b6f;
  --glass-bg:rgba(30,33,42,0.5); --glass-bg2:rgba(30,33,42,0.35); --glass-border:rgba(255,255,255,0.09);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  position:relative;
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(circle at 12% 18%, rgba(109,94,252,0.30), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(0,201,167,0.26), transparent 42%),
    radial-gradient(circle at 25% 85%, rgba(0,201,167,0.18), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(109,94,252,0.22), transparent 42%);
  filter: blur(50px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--glass-border);
  padding:14px 16px; display:flex; align-items:center; gap:10px;
}
.logo{font-weight:800; font-size:19px; letter-spacing:-0.5px;}
.logo span{color:var(--accent);}
.tagline{font-size:11px; color:var(--muted); margin-left:2px;}
header .spacer{flex:1;}
.theme-btn{
  border:1px solid var(--glass-border); background:var(--glass-bg2); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:13px; cursor:pointer;
}
.search-wrap{padding:12px 16px 4px;}
#search{
  width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--glass-border);
  background:var(--glass-bg2); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--text); font-size:14px; outline:none;
  transition:box-shadow .2s ease, border-color .2s ease;
}
#search:focus{ box-shadow:0 0 0 3px rgba(109,94,252,0.28); border-color:var(--accent); }
main{padding:12px 16px 32px; max-width:900px; margin:0 auto;}
.cat-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 4px 8px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
.card{
  background:var(--glass-bg2); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-border); border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,0.06);
  padding:14px 12px; cursor:pointer; text-align:left; transition:transform .12s ease, box-shadow .2s ease;
  animation:fadeSlideUp .45s cubic-bezier(.22,.9,.32,1) backwards;
}
.card:active{transform:scale(0.95);}
.card:hover{box-shadow:0 8px 24px rgba(109,94,252,0.18); transform:translateY(-2px);}
.card .icon{font-size:22px; margin-bottom:6px; display:block;}
.card .name{font-size:13px; font-weight:600; line-height:1.3;}
.hidden{display:none !important;}
#toolView{
  background:var(--glass-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass-border); border-radius:16px; padding:18px; box-shadow:0 8px 32px rgba(0,0,0,0.10);
  animation:popIn .3s cubic-bezier(.22,.9,.32,1);
}
.tool-header{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.back-btn{
  border:1px solid var(--glass-border); background:var(--glass-bg2); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--text); border-radius:10px;
  width:34px; height:34px; font-size:16px; cursor:pointer; flex-shrink:0;
}
.tool-header h2{font-size:17px; margin:0;}
textarea, input[type=text], input[type=number], select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--glass-border);
  background:var(--glass-bg2); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--text); font-size:14px; font-family:inherit; outline:none;
}
textarea{min-height:110px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; resize:vertical;}
label{font-size:12px; color:var(--muted); display:block; margin:10px 0 4px;}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
button.btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px;
  padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; transition:transform .1s ease, box-shadow .2s ease;
}
button.btn:active, button.btn.secondary:active, .theme-btn:active, .back-btn:active{ transform:scale(0.94); }
button.btn:hover{ box-shadow:0 4px 14px rgba(109,94,252,0.35); }
button.btn.secondary{background:var(--glass-bg2); color:var(--text); border:1px solid var(--glass-border); transition:transform .1s ease;}
.output{
  margin-top:12px; padding:10px 12px; background:var(--surface2); border-radius:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; white-space:pre-wrap; word-break:break-all;
  border:1px solid var(--border); min-height:20px; animation:fadeSlideUp .3s ease backwards;
}
.err{color:var(--danger); font-size:13px; margin-top:8px;}
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ from{opacity:0; transform:scale(0.94) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }
@keyframes spinIcon{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.theme-btn.spinning{ animation:spinIcon .5s ease; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
.stat{background:var(--surface2); border-radius:10px; padding:10px; text-align:center; border:1px solid var(--border);}
.stat b{display:block; font-size:18px;}
.stat span{font-size:11px; color:var(--muted);}
.calc-display{font-size:28px; text-align:right; padding:14px; background:var(--surface2); border-radius:10px; margin-bottom:10px; min-height:40px; overflow-x:auto; border:1px solid var(--border);}
.calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.calc-grid button{padding:16px 0; font-size:17px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer;}
.calc-grid button.op{background:var(--accent); color:#fff; border:none;}
.swatch{width:100%; height:60px; border-radius:10px; border:1px solid var(--border); margin-top:10px;}
.timer-display{font-size:40px; text-align:center; margin:14px 0; font-variant-numeric:tabular-nums;}
footer{text-align:center; color:var(--muted); font-size:11px; padding:20px 16px 30px;}
</style>
</head>
<body>
<header>
  <div><div class="logo">DEV<span>NEX</span></div><div class="tagline">Everything You Need. One Workspace.</div></div>
  <div class="spacer"></div>
  <button class="theme-btn" id="themeToggle">🌓 Theme</button>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Search tools…">
</div>

<main>
  <div id="dashboard"></div>
  <div id="toolView" class="hidden"></div>
</main>

<footer>DEVNEX Phase 1 · Offline-first · No data leaves your device</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const TOOLS = [
  {id:'json', cat:'Developer', icon:'{ }', name:'JSON Formatter'},
  {id:'base64', cat:'Developer', icon:'⇄', name:'Base64 Encode/Decode'},
  {id:'urlenc', cat:'Developer', icon:'🔗', name:'URL Encode/Decode'},
  {id:'uuid', cat:'Developer', icon:'#', name:'UUID Generator'},
  {id:'password', cat:'Developer', icon:'🔒', name:'Password Generator'},
  {id:'timestamp', cat:'Developer', icon:'⏱', name:'Unix Timestamp Converter'},
  {id:'color', cat:'Developer', icon:'🎨', name:'Color Converter'},
  {id:'wordcount', cat:'Text', icon:'📝', name:'Word/Char Counter'},
  {id:'case', cat:'Text', icon:'Aa', name:'Case Converter'},
  {id:'calc', cat:'General', icon:'🧮', name:'Calculator'},
  {id:'unit', cat:'General', icon:'📏', name:'Unit Converter'},
  {id:'stopwatch', cat:'General', icon:'⏳', name:'Stopwatch'},
  {id:'random', cat:'General', icon:'🎲', name:'Random Number'},
  {id:'lorem', cat:'Text', icon:'📜', name:'Lorem Ipsum Generator'},
  {id:'duplines', cat:'Text', icon:'🧹', name:'Duplicate Line Remover'},
  {id:'findreplace', cat:'Text', icon:'🔍', name:'Find and Replace'},
  {id:'textcompare', cat:'Text', icon:'⚖️', name:'Text Comparator'},
  {id:'regex', cat:'Developer', icon:'.*', name:'Regex Tester'},
  {id:'htmlentity', cat:'Developer', icon:'&amp;', name:'HTML Entity Encoder'},
  {id:'jwt', cat:'Developer', icon:'🪪', name:'JWT Decoder'},
  {id:'percent', cat:'General', icon:'%', name:'Percentage Calculator'},
  {id:'datecalc', cat:'General', icon:'📅', name:'Date Calculator'},
  {id:'countdown', cat:'General', icon:'⏲', name:'Countdown Timer'},
  {id:'worldclock', cat:'General', icon:'🌍', name:'World Clock'},
  {id:'notes', cat:'Text', icon:'🗒', name:'Notes Manager'},
  {id:'hash', cat:'Developer', icon:'#️⃣', name:'Hash Generator'},
  {id:'numbase', cat:'Developer', icon:'10₂', name:'Number Base Converter'},
  {id:'csv2json', cat:'Developer', icon:'📊', name:'CSV to JSON'},
  {id:'slug', cat:'Developer', icon:'🔗', name:'Slug Generator'},
  {id:'texttobinary', cat:'Developer', icon:'01', name:'Text ⇄ Binary'},
  {id:'devicecheck', cat:'Security', icon:'🛡️', name:'Browser & Device Info Check'},
  {id:'suraksha', cat:'Security', icon:'📋', name:'Phone Suraksha Guide'},
  {id:'linkcheck', cat:'Security', icon:'⚠️', name:'Suspicious Link Checker'},
  {id:'display', cat:'PhoneDoctor', icon:'🖥️', name:'Display Test (Dead Pixel)'},
  {id:'touchtest', cat:'PhoneDoctor', icon:'👆', name:'Touch Screen Test'},
  {id:'speakertest', cat:'PhoneDoctor', icon:'🔊', name:'Speaker Test'},
  {id:'mictest', cat:'PhoneDoctor', icon:'🎤', name:'Microphone Test'},
  {id:'vibrationtest', cat:'PhoneDoctor', icon:'📳', name:'Vibration Test'},
  {id:'camtest', cat:'PhoneDoctor', icon:'📷', name:'Camera Test'},
  {id:'batteryinfo', cat:'PhoneDoctor', icon:'🔋', name:'Battery Info'},
  {id:'heartrate', cat:'Health', icon:'❤️', name:'Heart Rate Estimator'},
  {id:'bmi', cat:'Health', icon:'⚖️', name:'BMI Calculator'},
  {id:'waterintake', cat:'Health', icon:'💧', name:'Water Intake Tracker'},
  {id:'routine', cat:'Productivity', icon:'⏰', name:'Routine Reminder (To-Do)'},
  {id:'docscan', cat:'Productivity', icon:'📄', name:'Document Scanner'},
  {id:'notepad', cat:'Productivity', icon:'📓', name:'Notepad'},
  {id:'codestudio', cat:'CodeStudio', icon:'🧑‍💻', name:'Code Editor & Projects'},
  {id:'apitester', cat:'CodeStudio', icon:'📡', name:'API Testing Studio'},
  {id:'markdown', cat:'Productivity', icon:'📝', name:'Documentation Studio (Markdown)'},
  {id:'backup', cat:'Productivity', icon:'💾', name:'Backup & Restore All Data'},
  {id:'viewer3d', cat:'Design', icon:'🧩', name:'3D Model Viewer (OBJ)'},
  {id:'logomaker', cat:'Design', icon:'🎨', name:'Logo & Icon Maker'},
  {id:'photoeditor', cat:'Design', icon:'🖼️', name:'Photo Editor'},
  {id:'dbmanager', cat:'CodeStudio', icon:'🗄️', name:'Database Manager'},
  {id:'photopuzzle', cat:'Games', icon:'🧩', name:'Photo Puzzle (Jigsaw)'},
  {id:'currency', cat:'General', icon:'💱', name:'Currency Converter'},
  {id:'agecalc', cat:'General', icon:'🎂', name:'Age Calculator'},
  {id:'emicalc', cat:'General', icon:'🏦', name:'EMI / Loan Calculator'},
  {id:'gstcalc', cat:'General', icon:'🧾', name:'GST Calculator'},
  {id:'tipcalc', cat:'General', icon:'🍽️', name:'Tip / Bill Split Calculator'},
  {id:'flashlight', cat:'General', icon:'🔦', name:'Flashlight'},
  {id:'compass', cat:'General', icon:'🧭', name:'Compass'},
  {id:'ruler', cat:'General', icon:'📏', name:'Screen Ruler (Approx)'},
  {id:'qrgen', cat:'Developer', icon:'▦', name:'QR Code Generator'},
  {id:'gradientgen', cat:'Developer', icon:'🌈', name:'CSS Gradient Generator'},
  {id:'imgmeta', cat:'Design', icon:'📷', name:'Image Metadata Viewer'},
  {id:'aspectratio', cat:'Design', icon:'📏', name:'Aspect Ratio Calculator'},
  {id:'filesizeconv', cat:'General', icon:'💾', name:'File Size Converter'},
];

const CATEGORY_LABELS = {Developer:'Developer Studio', Security:'Security & Info', PhoneDoctor:'Phone Doctor 🩺', Health:'Health & Wellness (Reference Only)', Productivity:'Productivity Tools', CodeStudio:'Code Studio 💻', Design:'Design & Media Studio', Games:'Games & Fun 🧩'};
function groupByCat(list){
  const m = {};
  list.forEach(t=>{ (m[t.cat]=m[t.cat]||[]).push(t); });
  return m;
}

function renderDashboard(filter=''){
  const dash = document.getElementById('dashboard');
  const f = filter.trim().toLowerCase();
  const filtered = TOOLS.filter(t=>t.name.toLowerCase().includes(f));
  const groups = groupByCat(filtered);
  dash.innerHTML = '';
  let idx = 0;
  Object.keys(groups).forEach(cat=>{
    const h = document.createElement('div');
    h.className='cat-title'; h.textContent=CATEGORY_LABELS[cat]||cat;
    dash.appendChild(h);
    const grid = document.createElement('div');
    grid.className='grid';
    groups[cat].forEach(t=>{
      const c = document.createElement('button');
      c.className='card';
      c.style.animationDelay = (idx*0.025)+'s';
      idx++;
      c.innerHTML = `<span class="icon">${t.icon}</span><span class="name">${t.name}</span>`;
      c.onclick = ()=>openTool(t.id);
      grid.appendChild(c);
    });
    dash.appendChild(grid);
  });
  if(filtered.length===0){
    dash.innerHTML = '<p style="color:var(--muted);text-align:center;margin-top:30px;">No tools match your search.</p>';
  }
}

document.getElementById('search').addEventListener('input', e=>renderDashboard(e.target.value));

function openTool(id){
  document.getElementById('dashboard').classList.add('hidden');
  const view = document.getElementById('toolView');
  view.classList.remove('hidden');
  const tool = TOOLS.find(t=>t.id===id);
  view.innerHTML = `<div class="tool-header"><button class="back-btn" onclick="closeTool()">←</button><h2>${tool.name}</h2></div><div id="toolBody"></div>`;
  TOOL_RENDER[id]();
}
function closeTool(){
  document.getElementById('toolView').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  if(window.__timerInterval) clearInterval(window.__timerInterval);
}

const TOOL_RENDER = {
  json(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Paste JSON</label><textarea id="jsonIn" placeholder='{"a":1,"b":[2,3]}'></textarea>
      <div class="row"><button class="btn" id="fmtBtn">Format &amp; Validate</button><button class="btn secondary" id="minBtn">Minify</button></div>
      <div id="jsonErr" class="err"></div><div id="jsonOut" class="output"></div>`;
    document.getElementById('fmtBtn').onclick = ()=>{
      try{ const v = JSON.parse(document.getElementById('jsonIn').value);
        document.getElementById('jsonOut').textContent = JSON.stringify(v,null,2);
        document.getElementById('jsonErr').textContent='';
      }catch(e){ document.getElementById('jsonErr').textContent='Invalid JSON: '+e.message; document.getElementById('jsonOut').textContent=''; }
    };
    document.getElementById('minBtn').onclick = ()=>{
      try{ const v = JSON.parse(document.getElementById('jsonIn').value);
        document.getElementById('jsonOut').textContent = JSON.stringify(v);
        document.getElementById('jsonErr').textContent='';
      }catch(e){ document.getElementById('jsonErr').textContent='Invalid JSON: '+e.message; document.getElementById('jsonOut').textContent=''; }
    };
  },
  base64(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Input</label><textarea id="b64In"></textarea>
      <div class="row"><button class="btn" id="encBtn">Encode</button><button class="btn secondary" id="decBtn">Decode</button></div>
      <div id="b64Err" class="err"></div><div id="b64Out" class="output"></div>`;
    document.getElementById('encBtn').onclick=()=>{
      try{ document.getElementById('b64Out').textContent = btoa(unescape(encodeURIComponent(document.getElementById('b64In').value))); document.getElementById('b64Err').textContent=''; }
      catch(e){ document.getElementById('b64Err').textContent='Encode failed: '+e.message; }
    };
    document.getElementById('decBtn').onclick=()=>{
      try{ document.getElementById('b64Out').textContent = decodeURIComponent(escape(atob(document.getElementById('b64In').value))); document.getElementById('b64Err').textContent=''; }
      catch(e){ document.getElementById('b64Err').textContent='Invalid Base64 input'; document.getElementById('b64Out').textContent=''; }
    };
  },
  urlenc(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Input</label><textarea id="urlIn"></textarea>
      <div class="row"><button class="btn" id="uencBtn">Encode</button><button class="btn secondary" id="udecBtn">Decode</button></div>
      <div id="urlErr" class="err"></div><div id="urlOut" class="output"></div>`;
    document.getElementById('uencBtn').onclick=()=>{ document.getElementById('urlOut').textContent = encodeURIComponent(document.getElementById('urlIn').value); document.getElementById('urlErr').textContent=''; };
    document.getElementById('udecBtn').onclick=()=>{
      try{ document.getElementById('urlOut').textContent = decodeURIComponent(document.getElementById('urlIn').value); document.getElementById('urlErr').textContent=''; }
      catch(e){ document.getElementById('urlErr').textContent='Invalid encoded input'; }
    };
  },
  uuid(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<div class="row"><button class="btn" id="genBtn">Generate UUID v4</button><button class="btn secondary" id="copyUuid">Copy</button></div><div id="uuidOut" class="output"></div>`;
    const gen = ()=>{
      const u = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0; return (c=='x'?r:(r&0x3|0x8)).toString(16);});
      document.getElementById('uuidOut').textContent = u;
    };
    gen();
    document.getElementById('genBtn').onclick = gen;
    document.getElementById('copyUuid').onclick = ()=>navigator.clipboard?.writeText(document.getElementById('uuidOut').textContent);
  },
  password(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Length: <span id="lenVal">16</span></label><input type="range" id="lenRange" min="6" max="64" value="16" style="width:100%;">
      <label><input type="checkbox" id="symChk" checked> Include symbols</label>
      <label><input type="checkbox" id="numChk" checked> Include numbers</label>
      <div class="row"><button class="btn" id="genPwBtn">Generate</button></div>
      <div id="pwOut" class="output"></div>`;
    document.getElementById('lenRange').oninput = e=>document.getElementById('lenVal').textContent=e.target.value;
    document.getElementById('genPwBtn').onclick = ()=>{
      const len = +document.getElementById('lenRange').value;
      let chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
      if(document.getElementById('numChk').checked) chars += '23456789';
      if(document.getElementById('symChk').checked) chars += '!@#$%^&*-_=+';
      let out='';
      const arr = new Uint32Array(len); crypto.getRandomValues(arr);
      for(let i=0;i<len;i++) out += chars[arr[i]%chars.length];
      document.getElementById('pwOut').textContent = out;
    };
  },
  timestamp(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Unix Timestamp (seconds)</label><input type="number" id="tsIn" placeholder="e.g. 1735689600">
      <div class="row"><button class="btn" id="tsToDate">Convert to Date</button><button class="btn secondary" id="tsNow">Use Now</button></div>
      <div id="tsOut" class="output"></div>
      <label style="margin-top:16px;">Date/time (local)</label><input type="datetime-local" id="dateIn">
      <div class="row"><button class="btn" id="dateToTs">Convert to Timestamp</button></div>
      <div id="dateOut" class="output"></div>`;
    document.getElementById('tsToDate').onclick = ()=>{
      const v = +document.getElementById('tsIn').value;
      if(isNaN(v)){ document.getElementById('tsOut').textContent='Enter a valid number'; return; }
      document.getElementById('tsOut').textContent = new Date(v*1000).toString();
    };
    document.getElementById('tsNow').onclick = ()=>{ document.getElementById('tsIn').value = Math.floor(Date.now()/1000); };
    document.getElementById('dateToTs').onclick = ()=>{
      const v = document.getElementById('dateIn').value;
      if(!v){ document.getElementById('dateOut').textContent='Pick a date/time'; return; }
      document.getElementById('dateOut').textContent = Math.floor(new Date(v).getTime()/1000);
    };
  },
  color(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>HEX</label><input type="text" id="hexIn" placeholder="#6d5efc">
      <div class="row"><button class="btn" id="convColor">Convert</button></div>
      <div id="colorErr" class="err"></div>
      <div class="output" id="colorOut"></div>
      <div class="swatch" id="swatch"></div>`;

      if(hex[0]!=='#') hex = '#'+hex;
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), bl = parseInt(hex.slice(5,7),16);
      const max=Math.max(r,g,bl)/255, min=Math.min(r,g,bl)/255;
      let h=0,s=0,l=(max+min)/2;
      if(max!==min){ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
        if(max===r/255) h=((g/255-bl/255)/d+(g<bl?6:0));
        else if(max===g/255) h=((bl/255-r/255)/d+2);
        else h=((r/255-g/255)/d+4);
        h*=60;
      }
      document.getElementById('colorOut').textContent = `HEX: ${hex}\nRGB: rgb(${r}, ${g}, ${bl})\nHSL: hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
      document.getElementById('swatch').style.background = hex;
      document.getElementById('colorErr').textContent='';
    };

    function fmt(ms){
      const m = Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), cs=Math.floor((ms%1000)/10);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    }
    function tick(){ document.getElementById('swDisp').textContent = fmt(elapsed + (running? Date.now()-startTs : 0)); }
    window.__timerInterval = setInterval(tick, 30);
    document.getElementById('swStart').onclick = (e)=>{
      if(!running){ running=true; startTs=Date.now(); e.target.textContent='Pause'; }
      else { running=false; elapsed += Date.now()-startTs; e.target.textContent='Start'; }
    };
    document.getElementById('swLap').onclick = ()=>{
      laps.push(fmt(elapsed + (running? Date.now()-startTs : 0)));

    let ctx=null, osc=null, pan=null;
    function play(pos){
      stop();
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      osc = ctx.createOscillator(); pan = ctx.createStereoPanner();
      osc.frequency.value = 440; pan.pan.value = pos;
      osc.connect(pan).connect(ctx.destination); osc.start();
    }
    function stop(){ if(osc){ try{osc.stop();}catch(e){} osc=null; } if(ctx){ try{ctx.close();}catch(e){} ctx=null; } }
    document.getElementById('spLeft').onclick = ()=>play(-1);
    document.getElementById('spRight').onclick = ()=>play(1);
    document.getElementById('spBoth').onclick = ()=>play(0);
    document.getElementById('spStop').onclick = stop;

  heartrate(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:14px; color:var(--danger);"><b>Dhyan dein:</b> Yeh ek wellness estimate hai, medical device nahi. Agar dil se juda koi real problem ho to doctor se milein, is number par depend na karein.</p>
      <p style="font-size:14px;">Apni ungli ko camera lens aur flash dono ke upar halke se rakhein, bilkul na hilayein, 15 second tak intezaar karein.</p>
      <div class="row"><button class="btn" id="hrStart">Measure Shuru Karein</button></div>
      <div id="hrErr" class="err"></div><div class="output" id="hrOut"></div>
      <video id="hrVideo" autoplay playsinline style="display:none;"></video><canvas id="hrCanvas" width="20" height="20" style="display:none;"></canvas>`;
    document.getElementById('hrStart').onclick = async ()=>{
      const out = document.getElementById('hrOut'); const err = document.getElementById('hrErr');
      out.textContent=''; err.textContent='';
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        const track = stream.getVideoTracks()[0];
        try{ await track.applyConstraints({advanced:[{torch:true}]}); }catch(e){}
        const video = document.getElementById('hrVideo'); video.srcObject = stream;
        const canvas = document.getElementById('hrCanvas'); const ctx = canvas.getContext('2d');
        const samples = [];
        out.textContent = 'Naap rahe hain... hilna mat.';
        const start = Date.now();
        const iv = setInterval(()=>{
          ctx.drawImage(video,0,0,20,20);
          const d = ctx.getImageData(0,0,20,20).data;
          let sum=0; for(let i=0;i<d.length;i+=4) sum += d[i];
          samples.push(sum/(d.length/4));
          if(Date.now()-start > 15000){
            clearInterval(iv);
            track.stop();
            let peaks=0; const avg = samples.reduce((a,c)=>a+c,0)/samples.length;
            for(let i=1;i<samples.length-1;i++){ if(samples[i]>samples[i-1] && samples[i]>samples[i+1] && samples[i]>avg) peaks++; }
            const bpm = Math.round(peaks * (60000/15000));
            if(bpm < 30 || bpm > 220) out.textContent = 'Saaf reading nahi mili — ungli ko flash aur camera dono par theek se rakh ke dobara try karein.';
            else out.textContent = `Estimated Heart Rate: ~${bpm} BPM (yeh ek rough wellness estimate hai, medical reading nahi)`;
          }
        }, 100);
      }catch(e){ err.textContent = 'Camera/flash access nahi mila, ya yeh device support nahi karta.'; }
    };

  codestudio(){
    const b = document.getElementById('toolBody');
    const LANGS = {html:'HTML', css:'CSS', js:'JavaScript', py:'Python', java:'Java', c:'C', cpp:'C++', json:'JSON', xml:'XML', md:'Markdown', txt:'Text'};
    function getExt(name){ const p=name.split('.'); return p.length>1 ? p.pop().toLowerCase() : 'txt'; }
    function loadProjects(){ try{ return JSON.parse(localStorage.getItem('devnex-projects')||'[]'); }catch(e){ return []; } }
    function saveProjects(list){ try{ localStorage.setItem('devnex-projects', JSON.stringify(list)); }catch(e){} }
    function getActive(){ return localStorage.getItem('devnex-active-project'); }
    function setActiveId(id){ try{ localStorage.setItem('devnex-active-project', id); }catch(e){} }
    let projects = loadProjects();
    if(!projects.length){
      const pid = Date.now().toString(36);
      projects = [{id:pid, name:'My Project', activeFile:0, files:[
        {name:'index.html', content:'<!DOCTYPE html>\n<html>\n<head>\n<title>My Page</title>\n</head>\n<body>\n<h1>Hello DEVNEX</h1>\n</body>\n</html>'},
        {name:'style.css', content:'body{\n  font-family: sans-serif;\n}'},

          <div id="csGutter" style="background:var(--surface2); color:var(--muted); font-family:ui-monospace,monospace; font-size:13px; line-height:20px; padding:8px 6px; text-align:right; user-select:none; overflow:hidden; min-width:34px; white-space:pre;"></div>

      const sel = document.getElementById('csProjSel');
      sel.innerHTML = projects.map(p=>`<option value="${p.id}" ${p.id===activeProjectId?'selected':''}>${p.name}</option>`).join('');
      sel.onchange = ()=>{ activeProjectId = sel.value; setActiveId(activeProjectId); render(); };
      const tabsEl = document.getElementById('csTabs');
      tabsEl.innerHTML = proj.files.map((f,i)=>`<button class="card" style="padding:6px 10px; ${i===proj.activeFile?'border-color:var(--accent);':''}" data-tab="${i}">${f.name}</button>`).join('');
      tabsEl.querySelectorAll('[data-tab]').forEach(btn=>{ btn.onclick = ()=>{ proj.activeFile = +btn.dataset.tab; saveProjects(projects); render(); }; });

        gutter.textContent = nums; gutter.scrollTop = editor.scrollTop;
      }
      updateGutter();
      let saveTimer;
      function onEdit(){
        file.content = editor.value; updateGutter();
        clearTimeout(saveTimer);
        document.getElementById('csSaved').textContent = 'Saving...';
        saveTimer = setTimeout(()=>{ saveProjects(projects); const s=document.getElementById('csSaved'); if(s) s.textContent='Saved'; }, 500);
      }
      editor.addEventListener('input', onEdit);

          const s=editor.selectionStart, en=editor.selectionEnd;

          editor.selectionStart = editor.selectionEnd = s+2; onEdit();
        } else if(e.key==='Enter'){

          const before = editor.value.slice(0,s);
          const line = before.slice(before.lastIndexOf('\n')+1);
          const indent = (line.match(/^\s*/)||[''])[0];
          const extra = /[{:]\s*$/.test(line) ? '  ' : '';
          setTimeout(()=>{

      document.getElementById('csExportProj').onclick = ()=>{
        const blob = new Blob([JSON.stringify(proj,null,2)],{type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = proj.name.replace(/\s+/g,'_')+'.json'; a.click();
      };
      document.getElementById('csImportProj').onchange = (e)=>{
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = ()=>{
          try{
            const imported = JSON.parse(reader.result);
            if(!imported.files || !Array.isArray(imported.files)) throw new Error('bad');
            imported.id = Date.now().toString(36);
            projects.push(imported); activeProjectId = imported.id; setActiveId(activeProjectId); saveProjects(projects); render();

      document.getElementById('csNewFile').onclick = ()=>{

      document.getElementById('csDeleteFile').onclick = ()=>{
        if(proj.files.length<=1){ alert('Kam se kam ek file zaroori hai.'); return; }
        if(!confirm('File delete karein?')) return;
        proj.files.splice(proj.activeFile,1); proj.activeFile = 0; saveProjects(projects); render();
      };
      document.getElementById('csPreview').onclick = ()=>{
        const htmlFile = proj.files.find(f=>getExt(f.name)==='html');

        const frame = document.getElementById('csFrame');

      };
      document.getElementById('csDownload').onclick = ()=>{

  apitester(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<div class="row"><select id="atMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><input type="text" id="atUrl" placeholder="https://api.example.com/..." style="flex:2;"></div>
      <label>Headers (ek line mein ek, jaise Content-Type: application/json)</label><textarea id="atHeaders" style="min-height:60px;"></textarea>
      <label>Body (JSON, GET/DELETE ke liye khali chhodein)</label><textarea id="atBody" style="min-height:80px;"></textarea>
      <div class="row"><button class="btn" id="atSend">Send Request</button></div>
      <div id="atErr" class="err"></div><div class="output" id="atOut"></div>
      <div id="atHistory" style="margin-top:14px;"></div>`;
    function loadHist(){ try{ return JSON.parse(localStorage.getItem('devnex-apihistory')||'[]'); }catch(e){ return []; } }
    function saveHist(h){ try{ localStorage.setItem('devnex-apihistory', JSON.stringify(h.slice(0,10))); }catch(e){} }
    function renderHist(){
      const h = loadHist();
      document.getElementById('atHistory').innerHTML = h.length ? '<label>Recent Requests</label>' + h.map((r,i)=>`<div class="output" style="margin-top:6px; cursor:pointer;" data-h="${i}">${r.method} ${r.url}</div>`).join('') : '';
      document.querySelectorAll('[data-h]').forEach(el=>{
        el.onclick = ()=>{ const r = loadHist()[+el.dataset.h]; document.getElementById('atMethod').value=r.method; document.getElementById('atUrl').value=r.url; document.getElementById('atHeaders').value=r.headers||''; document.getElementById('atBody').value=r.body||''; };
      });
    }
    renderHist();
    document.getElementById('atSend').onclick = async ()=>{
      const method = document.getElementById('atMethod').value;
      const url = document.getElementById('atUrl').value.trim();
      const headersText = document.getElementById('atHeaders').value;
      const bodyText = document.getElementById('atBody').value;
      const err = document.getElementById('atErr'); const out = document.getElementById('atOut');
      err.textContent=''; out.textContent='Sending...';
      if(!url){ err.textContent='URL daalein'; out.textContent=''; return; }
      const headers = {};
      headersText.split('\n').forEach(line=>{ const idx=line.indexOf(':'); if(idx>0){ headers[line.slice(0,idx).trim()] = line.slice(idx+1).trim(); } });
      const opts = { method, headers };
      if(method!=='GET' && method!=='DELETE' && bodyText.trim()){ opts.body = bodyText; }
      const start = performance.now();
      try{
        const res = await fetch(url, opts);
        const time = Math.round(performance.now()-start);
        let bodyOut;
        const ct = res.headers.get('content-type')||'';
        if(ct.includes('application/json')){ const j = await res.json(); bodyOut = JSON.stringify(j,null,2); }
        else { bodyOut = await res.text(); }
        out.textContent = `Status: ${res.status} ${res.statusText}\nTime: ${time}ms\n\n${bodyOut}`;
        const hist = loadHist(); hist.unshift({method,url,headers:headersText,body:bodyText}); saveHist(hist); renderHist();
      }catch(e){
        out.textContent='';
        err.textContent = 'Request fail hua — ho sakta hai CORS block kar raha ho (server ne is website se request allow nahi ki), ya URL/internet mein problem ho. Error: '+e.message;
      }
    };
  },

  viewer3d(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:13px; color:var(--muted);">Abhi sirf .obj files support hoti hain (GLB/GLTF ke liye extra loader chahiye jo is environment mein reliably available nahi hai).</p>
      <div class="row"><input type="file" id="v3File" accept=".obj"><input type="color" id="v3Bg" value="#15171c"></div>
      <div class="row"><button class="btn secondary" id="v3Wire">Wireframe Toggle</button><button class="btn secondary" id="v3Reset">Reset View</button><button class="btn secondary" id="v3Shot">Screenshot</button></div>
      <p style="font-size:12px; color:var(--muted); margin-top:6px;">Ungli se ghumayein, pinch/scroll se zoom karein.</p>
      <canvas id="v3Canvas" style="width:100%; height:320px; border-radius:10px; border:1px solid var(--border); margin-top:8px; touch-action:none;"></canvas>
      <div id="v3Err" class="err"></div>`;
    if(!window.THREE){ document.getElementById('v3Err').textContent='3D library load nahi hui — internet check karein.'; return; }
    const canvas = document.getElementById('v3Canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(document.getElementById('v3Bg').value);
    const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
    camera.position.set(0,0,5);
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    scene.add(new THREE.AmbientLight(0xffffff,0.7));
    const dl = new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(5,5,5); scene.add(dl);
    let mesh=null, dragging=false, lastX=0, lastY=0, dist=5;
    function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); }
    animate();
    canvas.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
    window.addEventListener('pointerup', ()=>{ dragging=false; });
    canvas.addEventListener('pointermove', e=>{
      if(!dragging || !mesh) return;
      const dx = e.clientX-lastX, dy = e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
      mesh.rotation.y += dx*0.01; mesh.rotation.x += dy*0.01;
    });
    canvas.addEventListener('wheel', e=>{ e.preventDefault(); dist = Math.max(1.5, Math.min(20, dist + e.deltaY*0.005)); camera.position.z = dist; }, {passive:false});
    document.getElementById('v3Bg').oninput = (e)=>{ scene.background = new THREE.Color(e.target.value); };
    document.getElementById('v3Wire').onclick = ()=>{ if(mesh) mesh.material.wireframe = !mesh.material.wireframe; };
    document.getElementById('v3Reset').onclick = ()=>{ if(mesh) mesh.rotation.set(0,0,0); dist=5; camera.position.z=5; };
    document.getElementById('v3Shot').onclick = ()=>{
      renderer.render(scene,camera);
      const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download='devnex-3d-screenshot.png'; a.click();
    };
    function parseOBJ(text){
      const verts=[]; const faces=[];
      text.split('\n').forEach(line=>{
        line=line.trim();
        if(line.indexOf('v ')===0){ const p=line.split(/\s+/); verts.push([parseFloat(p[1]),parseFloat(p[2]),parseFloat(p[3])]); }
        else if(line.indexOf('f ')===0){
          const p=line.split(/\s+/).slice(1).map(s=>parseInt(s.split('/')[0])-1);
          for(let i=1;i<p.length-1;i++){ faces.push([p[0],p[i],p[i+1]]); }
        }
      });
      const positions=[];
      faces.forEach(f=>{ f.forEach(idx=>{ const v=verts[idx]; if(v) positions.push(v[0],v[1],v[2]); }); });
      return new Float32Array(positions);
    }
    document.getElementById('v3File').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const positions = parseOBJ(reader.result);
          if(!positions.length) throw new Error('empty');
          if(mesh) scene.remove(mesh);
          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
          geo.computeVertexNormals();
          geo.computeBoundingSphere();
          const r = geo.boundingSphere ? geo.boundingSphere.radius||1 : 1;
          const mat = new THREE.MeshStandardMaterial({color:0x6d5efc, side:THREE.DoubleSide});
          mesh = new THREE.Mesh(geo, mat);
          mesh.scale.setScalar(1.5/r);
          if(geo.boundingSphere) mesh.position.copy(geo.boundingSphere.center).multiplyScalar(-1.5/r);
          scene.add(mesh);
          document.getElementById('v3Err').textContent='';
        }catch(err){ document.getElementById('v3Err').textContent = 'Yeh .obj file parse nahi ho payi.'; }
      };
      reader.readAsText(f);
    };
  },

  photoeditor(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<div class="row"><input type="file" id="peFile" accept="image/*"></div>
      <canvas id="peCanvas" style="max-width:100%; margin-top:10px; border-radius:10px; border:1px solid var(--border); touch-action:none;"></canvas>
      <label>Brightness</label><input type="range" id="peBright" min="50" max="150" value="100">
      <label>Contrast</label><input type="range" id="peContrast" min="50" max="150" value="100">
      <div class="row"><button class="btn secondary" id="peRotate">Rotate 90°</button><button class="btn secondary" id="peApplyFilter">Apply Brightness/Contrast</button></div>
      <label>Resize Width (px)</label><input type="number" id="peW">
      <label>Resize Height (px)</label><input type="number" id="peH">
      <div class="row"><button class="btn secondary" id="peResize">Apply Resize</button></div>
      <label>Crop (x, y, width, height in px)</label>
      <div class="row"><input type="number" id="peCx" placeholder="x"><input type="number" id="peCy" placeholder="y"><input type="number" id="peCw" placeholder="width"><input type="number" id="peCh" placeholder="height"></div>
      <div class="row"><button class="btn secondary" id="peCrop">Apply Crop</button></div>
      <label>Text Overlay</label><input type="text" id="peText" placeholder="Text likhein">
      <div class="row"><input type="color" id="peTextColor" value="#ffffff"><input type="number" id="peTextSize" value="40" style="width:80px;"><button class="btn secondary" id="peAddText">Add Text</button></div>
      <div class="row"><button class="btn secondary" id="peDrawToggle">Draw Mode: OFF</button><input type="color" id="peDrawColor" value="#ff0000"><input type="number" id="peDrawWidth" value="4" style="width:60px;"></div>
      <label>JPEG Quality (compression)</label><input type="range" id="peQuality" min="10" max="100" value="90">
      <div class="row"><button class="btn" id="pePng">Download PNG</button><button class="btn" id="peJpg">Download JPEG</button></div>`;
    const canvas = document.getElementById('peCanvas'); const ctx = canvas.getContext('2d');
    let drawMode=false, drawing=false;
    function loadImageToCanvas(img){
      const maxW=1000; const scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      ctx.filter='none'; ctx.drawImage(img,0,0,canvas.width,canvas.height);
      document.getElementById('peW').value = canvas.width; document.getElementById('peH').value = canvas.height;
    }
    function bake(cb){ const img = new Image(); img.onload = ()=>{ cb(img); }; img.src = canvas.toDataURL(); }
    document.getElementById('peFile').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const img = new Image(); img.onload = ()=>{ loadImageToCanvas(img); }; img.src = URL.createObjectURL(f);
    };
    document.getElementById('peRotate').onclick = ()=>{
      bake((img)=>{
        const w=canvas.width, h=canvas.height; canvas.width=h; canvas.height=w;
        ctx.save(); ctx.translate(h/2,w/2); ctx.rotate(Math.PI/2); ctx.drawImage(img,-w/2,-h/2); ctx.restore();
        document.getElementById('peW').value=canvas.width; document.getElementById('peH').value=canvas.height;
      });
    };
    document.getElementById('peApplyFilter').onclick = ()=>{
      bake((img)=>{
        const b2 = document.getElementById('peBright').value, c2 = document.getElementById('peContrast').value;
        ctx.filter = `brightness(${b2}%) contrast(${c2}%)`;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        ctx.filter='none';
      });
    };
    document.getElementById('peResize').onclick = ()=>{
      const w = +document.getElementById('peW').value, h = +document.getElementById('peH').value;
      if(!w||!h) return;
      bake((img)=>{ canvas.width=w; canvas.height=h; ctx.drawImage(img,0,0,w,h); });
    };
    document.getElementById('peCrop').onclick = ()=>{
      const x=+document.getElementById('peCx').value||0, y=+document.getElementById('peCy').value||0, w=+document.getElementById('peCw').value||canvas.width, h=+document.getElementById('peCh').value||canvas.height;
      try{
        const imgData = ctx.getImageData(x,y,w,h);
        canvas.width=w; canvas.height=h; ctx.putImageData(imgData,0,0);
        document.getElementById('peW').value=w; document.getElementById('peH').value=h;
      }catch(e){}
    };
    document.getElementById('peAddText').onclick = ()=>{
      const text = document.getElementById('peText').value; if(!text) return;
      const color = document.getElementById('peTextColor').value;
      const size = +document.getElementById('peTextSize').value || 40;
      ctx.fillStyle=color; ctx.font = `bold ${size}px sans-serif`; ctx.textAlign='center';
      ctx.fillText(text, canvas.width/2, canvas.height-30);
    };
    document.getElementById('peDrawToggle').onclick = (e)=>{ drawMode = !drawMode; e.target.textContent = 'Draw Mode: '+(drawMode?'ON':'OFF'); };
    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
      const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
      return {x:cx*scaleX, y:cy*scaleY};
    }
    canvas.addEventListener('pointerdown', (e)=>{ if(!drawMode) return; drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
    canvas.addEventListener('pointermove', (e)=>{ if(!drawMode||!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.strokeStyle=document.getElementById('peDrawColor').value; ctx.lineWidth=+document.getElementById('peDrawWidth').value; ctx.lineCap='round'; ctx.stroke(); });
    canvas.addEventListener('pointerup', ()=>{ drawing=false; });
    document.getElementById('pePng').onclick = ()=>{ const a = document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='devnex-photo.png'; a.click(); };
    document.getElementById('peJpg').onclick = ()=>{ const q = (+document.getElementById('peQuality').value)/100; const a = document.createElement('a'); a.href=canvas.toDataURL('image/jpeg',q); a.download='devnex-photo.jpg'; a.click(); };
  },

      if(tables.length<=1){ alert('Kam se kam ek table zaroori hai.'); return; }
      if(!confirm('Table delete karein?')) return;
      try{ localStorage.removeItem('devnex-db-'+activeTable); }catch(e){}
      tables = tables.filter(t=>t!==activeTable); saveTables(tables); activeTable = tables[0]; renderTableSel(); renderRecords();
    };
    document.getElementById('dbAddRecord').onclick = ()=>{
      const err = document.getElementById('dbErr');
      try{
        const obj = JSON.parse(document.getElementById('dbNewRecord').value);
        const d = loadTable(activeTable); d.push(obj); saveTable(activeTable,d);

      }catch(e){ err.textContent = 'Invalid JSON: '+e.message; }
    };
    document.getElementById('dbExport').onclick = ()=>{

  photopuzzle(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:14px;">Koi bhi photo chunein, woh tukdon mein kat ke shuffle ho jayegi — unhe ungli se chhoo kar sahi jagah par ghuma-ghumake lagayein.</p>
      <div class="row"><input type="file" id="ppFile" accept="image/*"></div>
      <label>Grid Size</label><select id="ppGrid"><option value="3">3 x 3 (Aasaan)</option><option value="4" selected>4 x 4 (Medium)</option><option value="5">5 x 5 (Mushkil)</option></select>
      <div class="row"><button class="btn" id="ppStart">Puzzle Banayein</button><button class="btn secondary" id="ppShuffle">Dobara Shuffle Karein</button><button class="btn secondary" id="ppPreview">Original Dekhein</button></div>
      <div id="ppErr" class="err"></div>
      <div id="ppStatus" style="font-size:13px; color:var(--muted); margin:6px 0;"></div>
      <div id="ppBoard" style="position:relative; width:100%; aspect-ratio:1; background:var(--surface2); border:1px solid var(--border); border-radius:10px; overflow:hidden; touch-action:none;"></div>`;
    let img=null, grid=4, pieces=[], cellSize=0;
    document.getElementById('ppFile').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const im = new Image();
      im.onload = ()=>{ img = im; document.getElementById('ppErr').textContent=''; };
      im.onerror = ()=>{ document.getElementById('ppErr').textContent='Photo load nahi hui.'; };
      im.src = URL.createObjectURL(f);
    };
    function buildPuzzle(){
      if(!img){ document.getElementById('ppErr').textContent='Pehle ek photo chunein.'; return; }
      grid = +document.getElementById('ppGrid').value;
      const board = document.getElementById('ppBoard');
      const boardSize = board.clientWidth;
      cellSize = boardSize/grid;
      const src = document.createElement('canvas');
      src.width = boardSize; src.height = boardSize;
      const sctx = src.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width-side)/2, sy = (img.height-side)/2;
      sctx.drawImage(img, sx, sy, side, side, 0, 0, boardSize, boardSize);
      pieces = [];
      for(let r=0;r<grid;r++){
        for(let c=0;c<grid;c++){
          const pc = document.createElement('canvas');
          pc.width = cellSize; pc.height = cellSize;
          const pctx = pc.getContext('2d');
          pctx.drawImage(src, c*cellSize, r*cellSize, cellSize, cellSize, 0,0, cellSize, cellSize);
          pieces.push({canvas:pc, correctRow:r, correctCol:c});
        }
      }
      placeShuffled();
    }
    function placeShuffled(){
      const board = document.getElementById('ppBoard');
      board.innerHTML='';
      const positions = [];
      for(let r=0;r<grid;r++) for(let c=0;c<grid;c++) positions.push({r,c});
      for(let i=positions.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=positions[i]; positions[i]=positions[j]; positions[j]=t; }
      pieces.forEach((p,i)=>{
        const pos = positions[i];
        p.curRow = pos.r; p.curCol = pos.c;
        const el = document.createElement('div');
        el.style.cssText = `position:absolute; width:${cellSize}px; height:${cellSize}px; left:${pos.c*cellSize}px; top:${pos.r*cellSize}px; border:1px solid rgba(255,255,255,0.3); cursor:grab;`;
        el.appendChild(p.canvas);
        el.dataset.idx = i;
        board.appendChild(el);
        makeDraggable(el, p, board);
      });
      updateStatus();
    }
    function makeDraggable(el, piece, board){
      let startX, startY, origLeft, origTop, dragging=false;
      function pointerDown(e){ dragging=true; el.style.zIndex=100; el.style.cursor='grabbing'; const pt = e.touches? e.touches[0] : e; startX = pt.clientX; startY = pt.clientY; origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top); e.preventDefault(); }
      function pointerMove(e){ if(!dragging) return; const pt = e.touches? e.touches[0] : e; const dx = pt.clientX-startX, dy = pt.clientY-startY; el.style.left = (origLeft+dx)+'px'; el.style.top = (origTop+dy)+'px'; }
      function pointerUp(){
        if(!dragging) return; dragging=false; el.style.zIndex=1; el.style.cursor='grab';
        let left = parseFloat(el.style.left), top = parseFloat(el.style.top);
        let col = Math.max(0, Math.min(grid-1, Math.round(left/cellSize)));
        let row = Math.max(0, Math.min(grid-1, Math.round(top/cellSize)));
        const other = pieces.find(p=>p!==piece && p.curRow===row && p.curCol===col);
        if(other){ other.curRow = piece.curRow; other.curCol = piece.curCol; const oEl = board.querySelector(`[data-idx="${pieces.indexOf(other)}"]`); if(oEl){ oEl.style.left=(other.curCol*cellSize)+'px'; oEl.style.top=(other.curRow*cellSize)+'px'; } }
        piece.curRow = row; piece.curCol = col;
        el.style.left = (col*cellSize)+'px'; el.style.top = (row*cellSize)+'px';
        updateStatus();
      }
      el.addEventListener('pointerdown', pointerDown);
      el.addEventListener('pointermove', pointerMove);
      el.addEventListener('pointerup', pointerUp);
      el.addEventListener('pointerleave', pointerUp);
    }
    function updateStatus(){
      const solved = pieces.every(p=>p.curRow===p.correctRow && p.curCol===p.correctCol);
      const s = document.getElementById('ppStatus'); if(!s) return;
      s.textContent = solved ? '🎉 Solved! Puzzle sahi se ban gaya.' : `Tukde ghuma ke sahi jagah lagayein (${grid*grid} tukde hain).`;
    }
    document.getElementById('ppStart').onclick = buildPuzzle;
    document.getElementById('ppShuffle').onclick = ()=>{ if(pieces.length) placeShuffled(); };
    document.getElementById('ppPreview').onclick = ()=>{
      if(!img) return;
      const board = document.getElementById('ppBoard');
      const existing = board.querySelector('img.ppPreviewImg');
      if(existing){ existing.remove(); return; }
      const imEl = document.createElement('img');
      imEl.className='ppPreviewImg';
      imEl.src = img.src;
      imEl.style.cssText = 'position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:200;';
      imEl.onclick = ()=>imEl.remove();
      board.appendChild(imEl);
    };
  },

    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Janam Tithi (Date of Birth)</label><input type="date" id="ageDob">
      <div class="row"><button class="btn" id="ageBtn">Umar Nikalein</button></div>
      <div class="output" id="ageOut"></div>`;
    document.getElementById('ageBtn').onclick = ()=>{
      const dob = document.getElementById('ageDob').value;
      if(!dob){ document.getElementById('ageOut').textContent='Date chunein'; return; }
      const d = new Date(dob), now = new Date();
      let years = now.getFullYear()-d.getFullYear();
      let months = now.getMonth()-d.getMonth();
      let days = now.getDate()-d.getDate();
      if(days<0){ months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
      if(months<0){ years--; months+=12; }
      document.getElementById('ageOut').textContent = `${years} saal, ${months} mahine, ${days} din`;
    };
  },
  emicalc(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Loan Amount</label><input type="number" id="emiP" placeholder="jaise 100000">
      <label>Interest Rate (saalana %)</label><input type="number" id="emiR" placeholder="jaise 9.5">
      <label>Tenure (mahine)</label><input type="number" id="emiN" placeholder="jaise 36">
      <div class="row"><button class="btn" id="emiBtn">EMI Nikalein</button></div>
      <div class="output" id="emiOut"></div>
      <p style="font-size:11px; color:var(--muted); margin-top:8px;">Yeh general calculation hai, financial advice nahi — exact terms ke liye bank se confirm karein.</p>`;
    document.getElementById('emiBtn').onclick = ()=>{
      const P = +document.getElementById('emiP').value, annualR = +document.getElementById('emiR').value, n = +document.getElementById('emiN').value;
      if(!P||!annualR||!n){ document.getElementById('emiOut').textContent='Saari values daalein'; return; }
      const r = annualR/12/100;
      const emi = P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
      const total = emi*n; const interest = total-P;
      document.getElementById('emiOut').textContent = `Monthly EMI: ₹${emi.toFixed(2)}\nTotal Payment: ₹${total.toFixed(2)}\nTotal Interest: ₹${interest.toFixed(2)}`;
    };
  },
  gstcalc(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Amount</label><input type="number" id="gstAmt" placeholder="jaise 1000">
      <label>GST %</label><select id="gstPct"><option>5</option><option>12</option><option selected>18</option><option>28</option></select>
      <div class="row"><button class="btn" id="gstAddBtn">GST Add Karein</button><button class="btn secondary" id="gstRemoveBtn">GST Hatayein</button></div>
      <div class="output" id="gstOut"></div>`;
    document.getElementById('gstAddBtn').onclick = ()=>{
      const amt = +document.getElementById('gstAmt').value, pct = +document.getElementById('gstPct').value;
      if(!amt){ document.getElementById('gstOut').textContent='Amount daalein'; return; }
      const gst = amt*pct/100;
      document.getElementById('gstOut').textContent = `GST Amount: ₹${gst.toFixed(2)}\nTotal (GST included): ₹${(amt+gst).toFixed(2)}`;
    };
    document.getElementById('gstRemoveBtn').onclick = ()=>{
      const amt = +document.getElementById('gstAmt').value, pct = +document.getElementById('gstPct').value;
      if(!amt){ document.getElementById('gstOut').textContent='Amount daalein'; return; }
      const base = amt/(1+pct/100); const gst = amt-base;
      document.getElementById('gstOut').textContent = `Base Amount (GST se pehle): ₹${base.toFixed(2)}\nGST Amount: ₹${gst.toFixed(2)}`;
    };
  },
  tipcalc(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Bill Amount</label><input type="number" id="tipBill" placeholder="jaise 1200">
      <label>Tip %</label><input type="number" id="tipPct" value="10">
      <label>Kitne log hain (split ke liye)</label><input type="number" id="tipPeople" value="1">
      <div class="row"><button class="btn" id="tipBtn">Calculate</button></div>
      <div class="output" id="tipOut"></div>`;
    document.getElementById('tipBtn').onclick = ()=>{
      const bill = +document.getElementById('tipBill').value, pct = +document.getElementById('tipPct').value||0, people = +document.getElementById('tipPeople').value||1;
      if(!bill){ document.getElementById('tipOut').textContent='Bill amount daalein'; return; }
      const tip = bill*pct/100; const total = bill+tip; const perPerson = total/people;
      document.getElementById('tipOut').textContent = `Tip: ₹${tip.toFixed(2)}\nTotal: ₹${total.toFixed(2)}\nPrati Vyakti: ₹${perPerson.toFixed(2)}`;
    };
  },
  flashlight(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:13px; color:var(--muted);">Yeh mostly Android Chrome par kaam karta hai; iPhone/Safari isse support nahi karta.</p>
      <div class="row"><button class="btn" id="flOn">Flashlight ON</button><button class="btn secondary" id="flOff">Flashlight OFF</button></div>
      <div id="flErr" class="err"></div>`;
    let flStream=null, flTrack=null;
    document.getElementById('flOn').onclick = async ()=>{
      try{
        flStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        flTrack = flStream.getVideoTracks()[0];
        await flTrack.applyConstraints({advanced:[{torch:true}]});
        document.getElementById('flErr').textContent='';
      }catch(e){ document.getElementById('flErr').textContent = 'Flashlight is device/browser par support nahi hai.'; }
    };
    document.getElementById('flOff').onclick = ()=>{
      if(flTrack){ try{ flTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }
      if(flStream){ flStream.getTracks().forEach(t=>t.stop()); }
    };
  },
  compass(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:13px; color:var(--muted);">Approximate compass hai, device sensor par depend karta hai. iPhone par permission allow karni hogi.</p>
      <div class="row"><button class="btn" id="cmpStart">Compass Shuru Karein</button></div>
      <div id="cmpErr" class="err"></div>
      <div style="text-align:center; margin-top:16px;"><div id="cmpNeedle" style="font-size:60px; transition:transform 0.2s;">🧭</div><div id="cmpDeg" style="font-size:20px; margin-top:8px;"></div></div>`;
    function handle(e){
      let heading = e.webkitCompassHeading!==undefined ? e.webkitCompassHeading : (360-(e.alpha||0));
      const n = document.getElementById('cmpNeedle'); if(!n) return;
      n.style.transform = `rotate(${heading}deg)`;
      document.getElementById('cmpDeg').textContent = Math.round(heading)+'°';
    }
    document.getElementById('cmpStart').onclick = async ()=>{
      try{
        if(typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
          const perm = await DeviceOrientationEvent.requestPermission();
          if(perm !== 'granted'){ document.getElementById('cmpErr').textContent='Permission nahi mili.'; return; }
        }
        window.addEventListener('deviceorientation', handle);
        document.getElementById('cmpErr').textContent='';
      }catch(e){ document.getElementById('cmpErr').textContent = 'Compass is device par support nahi hai.'; }
    };
  },
  ruler(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<p style="font-size:13px; color:var(--muted);">Yeh approximate ruler hai — apne phone ki screen size (diagonal inches mein) daalein, andazan measurement milega, exact nahi hoga.</p>
      <label>Screen Diagonal Size (inches)</label><input type="number" id="rulerSize" value="6.1">
      <div class="row"><button class="btn" id="rulerGo">Ruler Dikhayein</button></div>
      <div id="rulerArea" style="margin-top:14px; overflow-x:auto;"></div>`;
    document.getElementById('rulerGo').onclick = ()=>{
      const diag = +document.getElementById('rulerSize').value || 6.1;
      const wpx = window.screen.width, hpx = window.screen.height;
      const diagPx = Math.sqrt(wpx*wpx + hpx*hpx);
      const ppi = diagPx / diag;
      const cmPerPixel = 2.54/ppi;
      const totalCm = 15;
      const widthPx = totalCm/cmPerPixel;
      let marks = '';
      for(let cm=0; cm<=totalCm; cm++){
        marks += `<div style="position:absolute; left:${cm/cmPerPixel}px; top:0; width:1px; height:${cm%5===0?'24px':'14px'}; background:var(--text);"></div>`;
        if(cm%5===0) marks += `<div style="position:absolute; left:${cm/cmPerPixel+2}px; top:26px; font-size:10px;">${cm}</div>`;
      }
      document.getElementById('rulerArea').innerHTML = `<div style="position:relative; height:50px; width:${widthPx}px; background:var(--surface2); border:1px solid var(--border); border-radius:6px;">${marks}</div><p style="font-size:11px; color:var(--muted); margin-top:4px;">cm mein (andazan)</p>`;
    };
  },
  qrgen(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Text ya Link</label><textarea id="qrText" placeholder="https://example.com ya koi bhi text"></textarea>
      <div class="row"><button class="btn" id="qrBtn">QR Code Banayein</button></div>
      <div id="qrErr" class="err"></div>
      <div id="qrBox" style="margin-top:14px; display:flex; justify-content:center;"></div>
      <div class="row" id="qrDownloadRow" style="display:none;"><button class="btn secondary" id="qrDownload">Download PNG</button></div>`;
    document.getElementById('qrBtn').onclick = ()=>{
      const text = document.getElementById('qrText').value.trim();
      const box = document.getElementById('qrBox'); box.innerHTML='';
      if(!text){ document.getElementById('qrErr').textContent='Pehle kuch text ya link likhein'; return; }
      if(!window.QRCode){ document.getElementById('qrErr').textContent='QR library load nahi hui, internet check karein.'; return; }
      document.getElementById('qrErr').textContent='';
      new QRCode(box, {text, width:220, height:220});
      document.getElementById('qrDownloadRow').style.display='flex';
    };
    document.getElementById('qrDownload').onclick = ()=>{
      const img = document.querySelector('#qrBox img') || document.querySelector('#qrBox canvas');
      if(!img) return;
      const a = document.createElement('a');
      a.href = img.tagName==='CANVAS' ? img.toDataURL('image/png') : img.src;
      a.download='devnex-qr.png'; a.click();
    };
  },
  gradientgen(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Color 1</label><input type="color" id="gradC1" value="#6d5efc">
      <label>Color 2</label><input type="color" id="gradC2" value="#00c9a7">
      <label>Angle (degrees)</label><input type="range" id="gradAngle" min="0" max="360" value="90">
      <div id="gradPreview" style="height:120px; border-radius:12px; margin-top:12px; border:1px solid var(--border);"></div>
      <div class="output" id="gradCss"></div>
      <div class="row"><button class="btn secondary" id="gradCopy">CSS Copy Karein</button></div>`;
    function update(){
      const c1 = document.getElementById('gradC1').value, c2 = document.getElementById('gradC2').value, ang = document.getElementById('gradAngle').value;
      const css = `linear-gradient(${ang}deg, ${c1}, ${c2})`;
      document.getElementById('gradPreview').style.background = css;
      document.getElementById('gradCss').textContent = `background: ${css};`;
    }
    ['gradC1','gradC2','gradAngle'].forEach(id=>document.getElementById(id).addEventListener('input', update));
    update();
    document.getElementById('gradCopy').onclick = ()=>navigator.clipboard?.writeText(document.getElementById('gradCss').textContent);
  },
  imgmeta(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<div class="row"><input type="file" id="imFile" accept="image/*"></div><div class="output" id="imOut"></div>`;
    document.getElementById('imFile').onchange = (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const img = new Image();
      img.onload = ()=>{
        document.getElementById('imOut').textContent = `File Naam: ${f.name}\nType: ${f.type}\nSize: ${(f.size/1024).toFixed(1)} KB\nDimensions: ${img.width} x ${img.height} px\nLast Modified: ${new Date(f.lastModified).toLocaleString()}`;
      };
      img.src = URL.createObjectURL(f);
    };
  },
  aspectratio(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Width</label><input type="number" id="arW" placeholder="jaise 1920">
      <label>Height</label><input type="number" id="arH" placeholder="jaise 1080">
      <div class="row"><button class="btn" id="arBtn">Ratio Nikalein</button></div>
      <div class="output" id="arOut"></div>
      <label style="margin-top:14px;">Naya Width (same ratio mein Height nikalne ke liye)</label><input type="number" id="arNewW">
      <div class="row"><button class="btn secondary" id="arCalcH">Height Nikalein</button></div>
      <div class="output" id="arOut2"></div>`;
    function gcdCalc(a,b2){ return b2===0?a:gcdCalc(b2,a%b2); }
    document.getElementById('arBtn').onclick = ()=>{
      const w = +document.getElementById('arW').value, h = +document.getElementById('arH').value;
      if(!w||!h){ document.getElementById('arOut').textContent='Width aur height dono daalein'; return; }
      const g = gcdCalc(w,h);
      document.getElementById('arOut').textContent = `Ratio: ${w/g}:${h/g}`;
    };
    document.getElementById('arCalcH').onclick = ()=>{
      const w = +document.getElementById('arW').value, h = +document.getElementById('arH').value, newW = +document.getElementById('arNewW').value;
      if(!w||!h||!newW){ document.getElementById('arOut2').textContent='Pehle upar wale fields bhi bharein'; return; }
      document.getElementById('arOut2').textContent = `Naya Height: ${Math.round(newW*h/w)} px`;
    };
  },
  filesizeconv(){
    const b = document.getElementById('toolBody');
    b.innerHTML = `<label>Value</label><input type="number" id="fsVal" value="1">
      <label>From</label><select id="fsFrom"><option>Bytes</option><option>KB</option><option selected>MB</option><option>GB</option><option>TB</option></select>
      <div class="row"><button class="btn" id="fsBtn">Convert Karein</button></div>
      <div class="output" id="fsOut"></div>`;
    const UNITS = {Bytes:1, KB:1024, MB:1024*1024, GB:1024*1024*1024, TB:1024*1024*1024*1024};
    document.getElementById('fsBtn').onclick = ()=>{
      const val = +document.getElementById('fsVal').value, from = document.getElementById('fsFrom').value;
      if(val!==0 && !val){ document.getElementById('fsOut').textContent='Value daalein'; return; }
      const bytes = val*UNITS[from];
      document.getElementById('fsOut').textContent = Object.keys(UNITS).map(u=>`${u}: ${(bytes/UNITS[u]).toFixed(4)}`).join('\n');
    };
  }
};

function calcInput(v){
  const disp = document.getElementById('calcDisp');
  if(v==='C'){ window.__calcExpr=''; }
  else if(v==='⌫'){ window.__calcExpr = window.__calcExpr.slice(0,-1); }
  else if(v==='='){
    try{
      const expr = window.__calcExpr.replace(/[^0-9+\-*/.%()]/g,'');
      const result = Function('"use strict";return ('+expr+')')();
      window.__calcExpr = String(result);
    }catch(e){ window.__calcExpr = 'Error'; }
  } else {
    window.__calcExpr += v;
  }
  disp.textContent = window.__calcExpr || '0';
}

// Theme
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); }
let savedTheme = 'auto';
try{ savedTheme = localStorage.getItem('devnex-theme') || 'auto'; }catch(e){}
if(savedTheme!=='auto') applyTheme(savedTheme);
themeBtn.onclick = ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('devnex-theme', next); }catch(e){}
  themeBtn.classList.remove('spinning'); void themeBtn.offsetWidth; themeBtn.classList.add('spinning');
};

function checkRoutines(){
  let routines=[]; try{ routines = JSON.parse(localStorage.getItem('devnex-routines')||'[]'); }catch(e){}
  const now = new Date();
  const cur = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  window.__firedSet = window.__firedSet || new Set();
  routines.forEach(r=>{
    if(r.active && r.time===cur && !window.__firedSet.has(r.id+cur)){
      window.__firedSet.add(r.id+cur);
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator(); o.frequency.value=880; o.connect(ctx.destination); o.start();
        setTimeout(()=>{ try{o.stop(); ctx.close();}catch(e){} },600);
      }catch(e){}
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification('DEVNEX Reminder', {body:r.name}); }catch(e){}
      }
      alert('⏰ Reminder: '+r.name);
    }
  });
}
setInterval(checkRoutines, 15000);

renderDashboard();
</script>
